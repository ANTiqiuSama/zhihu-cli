[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihu-cli"
version = "0.3.0"
description = "A hybrid Zhihu CLI with an official Open Platform provider and full web automation tools."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Euq1DuliE" },
]
requires-python = ">=3.12"
dependencies = [
    "click",
    "curl-cffi",
    "lxml",
    "cssselect",
    "pyyaml",
    "rich",
    "aiomqtt",
    "textual>=2.0",
    "qrcode",
    "Pillow",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "ruff",
]
classifier = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "scikit-learn>=1.0.0",
    "jieba",
    "networkx",
    "numpy",
]
nlp = [
    "jieba",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "scikit-learn",
    "wordcloud",
    "networkx",
]
creator = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
]
notify = [
    "desktop-notifier",
]

[project.scripts]
zhihu-cli = "zhihu_cli.main:main"
zhihu = "zhihu_cli.main:main"

[project.urls]
Homepage = "https://github.com/ANTiqiuSama/zhihu-cli"
Repository = "https://github.com/ANTiqiuSama/zhihu-cli"
Issues = "https://github.com/ANTiqiuSama/zhihu-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zhihu_cli.prompts" = ["*.txt"]
"zhihu_cli.nlp_tools" = ["*.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
